<main><header>Technics · C-46</header><canvas width="982" height="681" role="img" aria-label="Cassettebandje met draaiende spoelen en bewegende tape"></canvas><footer><button disabled aria-pressed="false">Laden…</button><p role="status">De cassette wordt geladen.</p></footer></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const button=document.querySelector('button'),status=document.querySelector('[role=status]');
const photo=new Image();
let playing=false,angle=0,last=null,frame=null;
function reel(x,y,r,a){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.translate(x,y);ctx.rotate(a);ctx.drawImage(photo,-x,-y,982,681);ctx.restore();}
function tapePack(x,y,r,phase){
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.arc(x,y,181,0,Math.PI*2,true);ctx.clip();
  ctx.translate(x,y);ctx.rotate(phase);ctx.drawImage(photo,-x,-y,982,681);ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,982,681);
  ctx.save();ctx.beginPath();ctx.roundRect(23,42,940,596,33);ctx.clip();
  ctx.drawImage(photo,0,0,982,681);
  tapePack(295,314,195,angle);tapePack(691,313,183,angle*1.12);
  reel(295,314,181,angle);reel(691,313,180,angle*1.12);
  reel(122,577,32,angle*3);reel(862,577,32,angle*3);
  // Fine moving surface grain on the continuous tape, behind the clear housing.
  ctx.save();ctx.beginPath();ctx.rect(146,574,682,3);ctx.clip();
  ctx.fillStyle='rgba(37,26,19,.35)';ctx.fillRect(146,574,682,3);
  const travel=((-angle*180)%29+29)%29;
  for(let i=-1;i<25;i++){
    const x=146+i*29+travel;
    ctx.fillStyle='rgba(190,163,128,.18)';ctx.fillRect(x,574,1,3);
    ctx.fillStyle='rgba(10,8,6,.22)';ctx.fillRect(x+11,574,2,3);
  }
  ctx.restore();ctx.restore();
}
function tick(time){if(!playing)return;if(last!==null)angle-=Math.min(Math.max(time-last,0),80)*.00055;last=time;draw();frame=requestAnimationFrame(tick);}
function toggle(){playing=!playing;last=null;button.textContent=playing?'❚❚ Pauzeren':'▶ Afspelen';button.setAttribute('aria-pressed',String(playing));status.textContent=playing?'De spoelen draaien en de tape loopt.':'De cassette staat stil.';if(playing)frame=requestAnimationFrame(tick);else cancelAnimationFrame(frame);}
button.addEventListener('click',toggle);
photo.onload=()=>{button.disabled=false;button.textContent='▶ Afspelen';status.textContent='Klaar om af te spelen.';draw();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)toggle();};
photo.onerror=()=>{button.disabled=true;button.textContent='Niet beschikbaar';status.textContent='De cassetteafbeelding kon niet worden geladen.';};
