name: Build, release and deploy
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run typecheck && npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify shell scripts
        run: |
          bash -n scripts/install-lxc.sh scripts/deploy-lxc.sh scripts/install-termix.sh
          shellcheck scripts/install-lxc.sh scripts/deploy-lxc.sh scripts/install-termix.sh
      - name: Package deployment bundle
        run: python scripts/package.py --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: controldeck-linux
          path: dist/*
          retention-days: 14
      - name: Build and test Docker runtime
        run: |
          docker build --build-arg APP_COMMIT="$GITHUB_SHA" -t controldeck:test .
          docker run -d --name controldeck-test -p 127.0.0.1:8080:8080 controldeck:test
          trap 'docker logs controldeck-test; docker rm -f controldeck-test' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ready; then
              curl -fsS http://127.0.0.1:8080/health | python -c 'import json,os,sys; assert json.load(sys.stdin)["commit"] == os.environ["GITHUB_SHA"]'
              exit 0
            fi
            sleep 2
          done
          exit 1
  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="sha-$GITHUB_SHA"
          docker build --build-arg APP_COMMIT="$GITHUB_SHA" -t "$image:$tag" .
          docker push "$image:$tag"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$image:$tag" "$image:$GITHUB_REF_NAME"
            docker push "$image:$GITHUB_REF_NAME"
          else
            docker tag "$image:$tag" "$image:main"
            docker push "$image:main"
          fi
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: controldeck-linux
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "ControlDeck $GITHUB_REF_NAME" --generate-notes
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.LXC_DEPLOY_ENABLED == 'true'
    needs: [verify, publish]
    runs-on: [self-hosted, linux, controldeck-production]
    environment: production
    concurrency:
      group: controldeck-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: controldeck-linux
          path: ${{ runner.temp }}/controldeck-bundle
      - name: Deploy verified commit
        env:
          BUNDLE_DIR: ${{ runner.temp }}/controldeck-bundle
        run: |
          cd "$BUNDLE_DIR"
          sha256sum -c SHA256SUMS
          checksum=$(cut -d ' ' -f 1 SHA256SUMS)
          sudo /usr/local/sbin/controldeck-deploy "$BUNDLE_DIR/controldeck-linux.tar.gz" "$checksum" "$GITHUB_SHA"
