# Included in the host nginx http context. App remains independently deployed.
map $http_upgrade $controldeck_connection {
    default upgrade;
    '' close;
}
map $upstream_http_content_security_policy $termix_csp {
    default $upstream_http_content_security_policy;
    "~^(.*)frame-ancestors 'none'(.*)$" "$1frame-ancestors 'self'$2";
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;
    location = /_termix_authorize {
        internal;
        proxy_pass http://127.0.0.1:8081/api/termix/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $termix_original_method;
        proxy_set_header X-Original-Upgrade $http_upgrade;
    }
    location = /termix { return 308 /termix/; }
    # Provisioning, alternate login and registration must never bypass ControlDeck.
    location ^~ /termix/users/create { return 403; }
    location ^~ /termix/users/login { return 403; }
    location ^~ /termix/users/auth/ { return 403; }
    location ^~ /termix/users/internal/ { return 403; }
    location /termix/ {
        set $termix_original_method $request_method;
        auth_request /_termix_authorize;
        auth_request_set $termix_username $upstream_http_x_forwarded_username;
        auth_request_set $termix_role $upstream_http_x_forwarded_role;
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $controldeck_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Username $termix_username;
        proxy_set_header X-Forwarded-Role $termix_role;
        proxy_set_header Accept-Encoding '';
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cookie_path / /termix/;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy $termix_csp always;
        add_header Cache-Control no-store always;
        # Official image resolves runtime API and WebSocket paths from this meta.
        sub_filter '<head>' '<head><meta name="termix-base-path" content="/termix">';
        sub_filter 'src="/' 'src="/termix/';
        sub_filter 'href="/' 'href="/termix/';
        sub_filter_once off;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
